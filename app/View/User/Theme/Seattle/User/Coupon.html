#{include file="../Common/Header.html"}
<div class="st-page-shell st-management-page" data-st-page="coupon" data-st-controller="/assets/user/controller/business/coupon.js" data-st-table="#coupon-table">
    #{include file="../Common/Nav.html"}
    <main class="st-main st-main--wide">
        <header class="st-page-header">
            <div><span class="st-kicker">#{t("营销代券")}</span><h1>#{t("代券管理")}</h1><p>#{t("生成、筛选并追踪代券状态，让营销发放更有秩序。")}</p></div>
            <div class="st-page-header__actions"><button type="button" class="st-button st-button--primary button-add" aria-label="#{t('生成代券')}"><span class="material-icons-outlined">add</span><span>#{t("生成代券")}</span></button></div>
        </header>
        <section class="st-panel st-panel--flush" aria-labelledby="st-coupon-title">
            <div class="st-panel__header"><div><strong id="st-coupon-title">#{t("代券列表")}</strong><small>#{t("批量管理当前选中的代券")}</small></div><span class="st-panel__icon material-icons-outlined">local_offer</span></div>
            <div class="st-toolbar" aria-label="#{t('批量操作')}">
                <button type="button" class="st-tool-button st-button--danger button-del"><span class="material-icons-outlined">delete</span>#{t("移除选中")}</button>
                <button type="button" class="st-tool-button button-lock"><span class="material-icons-outlined">lock</span>#{t("锁定选中")}</button>
                <button type="button" class="st-tool-button button-unlock"><span class="material-icons-outlined">lock_open</span>#{t("解锁选中")}</button>
                <button type="button" class="st-tool-button button-export"><span class="material-icons-outlined">download</span>#{t("导出筛选")}</button>
            </div>
            <div class="st-panel__body st-table-wrap"><table id="coupon-table" aria-label="#{t('代券列表')}"></table></div>
        </section>
    </main>
</div>
#{ready(\App\Util\Helper::themeUrl('Assets/Js/Page/Management.js'))}
#{include file="../Common/Footer.html"}
