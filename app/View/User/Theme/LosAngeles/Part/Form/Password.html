#{include file="../SecurityNav.html"}
<form class="layui-form form-data la-form la-form--card">
    <div class="la-field">
        <label class="la-label">#{t("当前密码")}</label>
        <input class="la-input" type="password" name="old_password" autocomplete="off" placeholder="#{t('请输入正在使用的密码')}">
    </div>
    <div class="la-field">
        <label class="la-label">#{t("新密码")}</label>
        <input class="la-input" type="password" name="password" autocomplete="off" placeholder="#{t('至少 6 位，建议字母加数字')}">
    </div>
    <div class="la-field">
        <label class="la-label">#{t("确认新密码")}</label>
        <input class="la-input" type="password" name="re_password" autocomplete="off" placeholder="#{t('再输入一次新密码')}">
    </div>
    <button type="button" class="la-btn la-btn--brand la-btn--lg save-data">
        #{\App\View\User\Theme\LosAngeles\Icons::svg('shield')}<span>#{t("保存修改")}</span>
    </button>
</form>
