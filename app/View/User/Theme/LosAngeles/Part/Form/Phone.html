#{include file="../SecurityNav.html"}
<form class="layui-form form-data la-form la-form--card">
    <div class="la-field">
        <label class="la-label">#{t("当前手机号")}</label>
        <input class="la-input" type="text" value="#{$user.phone|escape:'html'}" placeholder="#{t('尚未绑定')}" disabled>
    </div>
    <div class="la-field">
        <label class="la-label">#{t("新手机号")}</label>
        <input class="la-input" type="tel" name="phone" autocomplete="off" placeholder="#{t('请输入要绑定的手机号')}">
    </div>
    <div class="la-field">
        <label class="la-label">#{t("短信验证码")}</label>
        <div class="la-sendrow">
            <input class="la-input" type="text" name="phone_captcha" autocomplete="off" placeholder="#{t('查收短信中的验证码')}">
            <button type="button" class="la-btn la-btn--line send-captcha">#{t("获取验证码")}</button>
        </div>
    </div>
    <button type="button" class="la-btn la-btn--brand la-btn--lg save-data">
        #{\App\View\User\Theme\LosAngeles\Icons::svg('check')}<span>#{t("保存修改")}</span>
    </button>
</form>
