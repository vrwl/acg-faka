<div data-kt-menu-trigger="click"
     class="menu-item menu-accordion #{if str_starts_with(getLocalRouter(), '/plugin/Blog/')} here show #{/if}">
    <span class="menu-link">
        <!--必须内联 SVG：侧栏在每个后台页面都渲染，而 .blogi-* 图标类定义在插件自己的
            admin.css 里，只有插件页面才加载它 —— 用类名的话菜单图标在别的页面就是空的。
            写法对齐核心 Header.html 的 menu-svg + currentColor -->
        <span class="menu-icon">
            <svg class="menu-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M19 1l-5 5v11l5-4.5V1zM1 6v14.65c0 .25.25.5.5.5c.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5V6c-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6zm22 13.5V6c-.6-.45-1.25-.75-2-1v13.5c-1.1-.35-2.3-.5-3.5-.5c-1.7 0-4.15.65-5.5 1.5v2c1.35-.85 3.8-1.5 5.5-1.5c1.65 0 3.35.3 4.75 1.05c.1.05.15.05.25.05c.25 0 .5-.25.5-.5z"/></svg>
        </span>
        <span class="menu-title">#{\App\Plugin\Blog\Core\Settings::adminLabel()}</span>
        <span class="menu-arrow"></span>
    </span>
    <div class="menu-sub menu-sub-accordion menu-active-bg">
        <div class="menu-item">
            <a class="menu-link #{if in_array(getLocalRouter(), ['/plugin/Blog/panel/posts', '/plugin/Blog/panel/write'])}active#{/if}"
               href="/plugin/Blog/panel/posts">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">#{t("文章")}</span>
            </a>
            <a class="menu-link #{if getLocalRouter() == '/plugin/Blog/panel/pages'}active#{/if}"
               href="/plugin/Blog/panel/pages">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">#{t("独立页面")}</span>
            </a>
            <a class="menu-link #{if getLocalRouter() == '/plugin/Blog/panel/categories'}active#{/if}"
               href="/plugin/Blog/panel/categories">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">#{t("分类")}</span>
            </a>
            <a class="menu-link #{if getLocalRouter() == '/plugin/Blog/panel/tags'}active#{/if}"
               href="/plugin/Blog/panel/tags">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">#{t("标签")}</span>
            </a>
            <a class="menu-link #{if getLocalRouter() == '/plugin/Blog/panel/comments'}active#{/if}"
               href="/plugin/Blog/panel/comments">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">#{t("评论")}<span class="blog-menu-pending-badge" data-blog-pending-badge
                                                          style="display:none;margin-left:8px;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--md-error,#f1416c);color:#fff;font-size:11px;padding:0 5px"></span></span>
            </a>
            <a class="menu-link #{if getLocalRouter() == '/plugin/Blog/panel/settings'}active#{/if}"
               href="/plugin/Blog/panel/settings">
                <span class="menu-bullet"><span class="bullet bullet-dot"></span></span>
                <span class="menu-title">#{t("设置")}</span>
            </a>
        </div>
    </div>
</div>
